<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .plate {
      fill: #e4e6e6;
    }
    .cell {
      fill: #3a3a3a;
    }
    .accent {
      fill: #57a0d9;
    }
    @media (prefers-color-scheme: dark) {
      .plate {
        fill: #201e21;
      }
      .cell {
        fill: #d8dee9;
      }
    }
  </style>
  <rect class="plate" width="32" height="32" rx="7" />
  <rect class="cell" x="6" y="6" width="9" height="9" rx="2.5" />
  <rect class="accent" x="17" y="6" width="9" height="9" rx="2.5" />
  <rect class="cell" x="6" y="17" width="9" height="9" rx="2.5" />
  <rect class="cell" x="17" y="17" width="9" height="9" rx="2.5" />
</svg>
